[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptic-cti"
version = "0.1.3"
description = "Multilingual CTI collections pipeline for normalizing and structuring cybercrime leads"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "spacy",
    "gliner",
    "joblib",
    "scikit-learn",
    "sentence-transformers",
]
authors = [
    { name="Cosmic Octopus" }
]

[project.scripts]
cryptic = "cryptic.cli:main"
cryptic-yara-check = "cryptic.yara_check.cli:main"
cryptic-stix-export = "cryptic.stix_export.cli:main"
cryptic-analytics-load = "cryptic.analytics.loader:main"
cryptic-mcp-server = "cryptic.mcp_server.server:main"
cryptic-rss-ingest = "cryptic.rss_ingest.cli:main"
cryptic-demo = "cryptic.demo.cli:main"
cryptic-stix-ingest = "cryptic.stix_ingest.cli:main"
cryptic-enrich-indicators = "cryptic.enrichment.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptic*"]
exclude = ["scripts*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
yara = [
    "yara-python",
]
stix = [
    "stix2",
]
mcp = [
    "mcp",
]
analytics = [
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
]
all = [
    "yara-python",
    "stix2",
    "mcp",
    "duckdb",
    "dbt-core",
    "dbt-duckdb",
]

[tool.setuptools.package-data]
cryptic = [
    "classification/configs/*.json",
    "enrichment/configs/*.json",
    "yara_check/configs/*.json",
    "stix_export/configs/*.json",
    "analytics/*.json",
    "analytics/dbt_project.yml",
    "analytics/models/*.sql",
    "analytics/airflow/*.py",
    "demo/fixtures/*",
    "rss_ingest/fixtures/*",
    "stix_ingest/fixtures/*",
]
