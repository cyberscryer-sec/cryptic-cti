name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python3 -m ruff check cryptic scripts tests pyproject.toml

      - name: Run tests
        run: |
          python3 -m pytest -q -p no:cacheprovider \
            tests/test_parser_utils.py \
            tests/test_ctier_parser.py \
            tests/test_classifier_migration.py \
            tests/test_cti_extensions.py \
            tests/test_demo_and_rss.py \
            tests/test_stix_ingest.py \
            tests/test_regex_ioc_extraction.py \
            tests/test_indicator_enrichment.py
