name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check cryptic scripts tests pyproject.toml

      - name: Run tests
        run: |
          pytest -q -p no:cacheprovider \
            tests/test_parser_utils.py \
            tests/test_ctier_parser.py \
            tests/test_classifier_migration.py \
            tests/test_cti_extensions.py \
            tests/test_demo_and_rss.py \
            tests/test_stix_ingest.py \
            tests/test_regex_ioc_extraction.py \
            tests/test_indicator_enrichment.py
